<div class="card h-100">
  <img
    class="card-img-top"
    [src]="'/images/' + trip().image"
    [alt]="trip().name"
  />

  <div class="card-body">
    <h5 class="card-title">{{ trip().name }}</h5>

    <p class="card-text">
      <strong>Code:</strong> {{ trip().code }}
    </p>

    <p class="card-text">
      <strong>Length:</strong> {{ trip().length }}
    </p>

    <p class="card-text">
      <strong>Resort:</strong> {{ trip().resort }}
    </p>

    <p class="card-text">
      <strong>Price per Person:</strong> ${{ trip().perPerson }}
    </p>

    <div [innerHTML]="trip().description"></div>
  </div>
</div>
