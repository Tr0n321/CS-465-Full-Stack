<div class="container mt-4">
  <div class="row">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card p-4">
        <h2>Admin Login</h2>

        <form (ngSubmit)="onLoginSubmit()">

          <div
            *ngIf="formError"
            class="alert alert-danger"
            role="alert">
            {{ formError }}
          </div>

          <div class="mb-3">
            <label for="name" class="form-label">
              Name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              placeholder="Admin User"
              [(ngModel)]="credentials.name">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="admin@travlr.com"
              [(ngModel)]="credentials.email">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Enter password"
              [(ngModel)]="credentials.password">
          </div>

          <button
            type="submit"
            class="btn btn-primary">
            Sign In
          </button>

        </form>
      </div>
    </div>
  </div>
</div>
