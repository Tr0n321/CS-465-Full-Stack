<div class="container mt-4 mb-5">
  <div class="card">
    <div class="card-body">
      <h2 class="card-title mb-4">Add New Trip</h2>

      <form (ngSubmit)="addTrip()">

        <div class="mb-3">
          <label class="form-label">Trip Code</label>
          <input
            type="text"
            class="form-control"
            name="code"
            [(ngModel)]="trip.code"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Trip Name</label>
          <input
            type="text"
            class="form-control"
            name="name"
            [(ngModel)]="trip.name"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Length</label>
          <input
            type="text"
            class="form-control"
            name="length"
            [(ngModel)]="trip.length"
            placeholder="4 nights / 5 days"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Start Date</label>
          <input
            type="date"
            class="form-control"
            name="start"
            [(ngModel)]="trip.start"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Resort</label>
          <input
            type="text"
            class="form-control"
            name="resort"
            [(ngModel)]="trip.resort"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Price per Person</label>
          <input
            type="number"
            class="form-control"
            name="perPerson"
            [(ngModel)]="trip.perPerson"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Image</label>
          <select
            class="form-select"
            name="image"
            [(ngModel)]="trip.image"
          >
            <option value="reef1.jpg">reef1.jpg</option>
            <option value="reef2.jpg">reef2.jpg</option>
            <option value="reef3.jpg">reef3.jpg</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            rows="4"
            name="description"
            [(ngModel)]="trip.description"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
          Add Trip
        </button>

        @if (message()) {
          <div class="alert alert-info mt-3">
            {{ message() }}
          </div>
        }

      </form>
    </div>
  </div>
</div>
